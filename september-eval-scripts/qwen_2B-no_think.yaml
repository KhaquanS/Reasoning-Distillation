# Both requested models, evaluated with identical generation settings.
models:
  - name: qwen-reasondistill-final-continue-epoch_1-no_think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen_reasondistill_final_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: false
    model_type: qwen
    strip_language_model_prefix: true

  - name: qwen-3.5-2b-no_think
    checkpoint: Qwen/Qwen3.5-2B
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: false
    model_type: qwen
    strip_language_model_prefix: false

benchmarks:
  - gsm8k
  - mmlu
  - arc-c
  - hellaswag

output_dir: ./eval_outputs/september/no_think
cache_dir: ./cache
split: test
max_samples: 1000
seed: 42

generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  batch_size: 32

benchmark_options:
  mmlu:
    subject: all
  hellaswag:
    split: validation
