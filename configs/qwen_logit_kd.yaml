# Logit KD baseline matching configs/qwen_reasondistill_final.yaml.
# Run both stages: bash scripts/train_logit_kd.sh
# Run this stage: python scripts/train.py --config configs/qwen_logit_kd.yaml

experiment:
  name: logit_kd_qwen
  seed: 42

data:
  dataset: amdeepseek
  max_samples: 40_000
  skip_samples: 0
  cache_dir: ./cache

method:
  name: logit_kd

model:
  teacher: Qwen/Qwen3.5-4B
  student: Qwen/Qwen3.5-2B
  teacher_quantize_8bit: true
  student_checkpoint: null

training:
  max_length: 2048
  batch_size: 1
  accum_steps: 128
  epochs: 1

  lr: 2.0e-5
  min_lr: 4.0e-6
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 0.7
  adam_betas: [0.9, 0.98]

  scheduler_type: cosine_restarts
  restart_interval_steps: 39
  restart_mult: 1

loss:
  temperature: 4.0
  alpha_kd: 0.3
  alpha_align: 0.0
  beta_ce: 0.9

logging:
  checkpoint_dir: ./checkpoints/qwen_logit_kd
  log_dir: ./logs/qwen_logit_kd
  loss_log_entries_per_epoch: 50
  save_every_n_steps: 200
