# Logit KD continuation matching configs/qwen_reasondistill_final_continue.yaml.
# Initialize from the first KD stage, then train on the next 12,032 examples.
# Run: python scripts/train.py --config configs/qwen_logit_kd_continue.yaml

experiment:
  name: logit_kd_qwen_continue
  seed: 42

data:
  dataset: amdeepseek
  max_samples: 12_032
  skip_samples: 40_000
  cache_dir: ./cache

method:
  name: logit_kd

model:
  teacher: Qwen/Qwen3.5-4B
  student: Qwen/Qwen3.5-2B
  teacher_quantize_8bit: true
  student_checkpoint: ./checkpoints/qwen_logit_kd/epoch_1

training:
  max_length: 2048
  batch_size: 1
  accum_steps: 128
  epochs: 1

  lr: 3.0e-5
  min_lr: 1.5e-5
  warmup_ratio: 0.04
  weight_decay: 0.015
  max_grad_norm: 1.2
  adam_betas: [0.9, 0.98]

  scheduler_type: cosine_restarts
  restart_interval_steps: 31
  restart_mult: 1

loss:
  temperature: 4.0
  alpha_kd: 0.30
  alpha_align: 0.0
  beta_ce: 0.75

logging:
  checkpoint_dir: ./checkpoints/qwen_logit_kd_continue
  log_dir: ./logs/qwen_logit_kd_continue
  loss_log_entries_per_epoch: 17
  save_every_n_steps: 60
