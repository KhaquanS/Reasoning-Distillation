# Generate 8 independent samples per question once; estimate pass@2, @4 and @8.
# python -m custom_eval.run_eval --config configs/sweep_pass_k.yaml
models:
  - name: qwen-3.5-2b-think
    checkpoint: Qwen/Qwen3.5-2B
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: false

  - name: qwen-logit-kd-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen-logitKD-final/qwen_logit_kd_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true

  - name: qwen-reasondistill-final-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen_reasondistill_final_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true

benchmarks:
  - mmlu
  - gsm8k
  - hellaswag
  - aime25
  - math500
  - arc-c

output_dir: ./eval_outputs/sweep_pass_k
cache_dir: ./cache
split: test
max_samples: 1000       # Full MATH-500 (500) and AIME 2025 (30); 1000 for the others.
seed: 42
require_real_data: true

generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: [2, 4, 8]
  num_samples: 8
  sample_batch_size: 1  # Samples per question per generate call; limits GPU memory.
  batch_size: 1        # Questions per batch; matches qwen_logit_kd_continue.yaml.

benchmark_options:
  mmlu:
    subject: all
  hellaswag:
    split: validation
  aime25:
    max_new_tokens: 16384
    batch_size: 1
